<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyRock - Social Network</title>
  <style>
    :root {
      --primary: #ffff00;
      --bg-dark: #0a0a0a;
      --glass: rgba(255, 255, 255, 0.1);
    }

    body {
      background-color: var(--bg-dark);
      margin: 0;
      overflow-x: hidden;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1; 
      pointer-events: none;
    }

    .navbar {
      background-color: var(--primary);
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .nav-btn {
      padding: 10px 25px;
      cursor: pointer;
      font-weight: 800;
      border-radius: 30px;
      border: 2px solid transparent;
      background: black;
      color: white;
      transition: all 0.2s ease;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .nav-btn:hover {
      background: #333;
      transform: translateY(-2px);
    }

    .nav-btn.active {
      background: white;
      color: black;
      border-color: black;
    }

    .page {
      display: none; 
      padding: 40px 20px;
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
      animation: fadeIn 0.4s ease-out;
    }

    .page.active { display: block; }

    h1 {
      background: linear-gradient(45deg, #4b0082, #b026ff);
      padding: 15px 40px;
      border-radius: 50px;
      color: var(--primary);
      display: inline-block;
      margin-bottom: 30px;
      border: 3px solid var(--primary);
      box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
    }

    .post-box {
      background: var(--glass);
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 40px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 0, 0.2);
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 100px;
      border-radius: 12px;
      padding: 15px;
      border: 2px solid transparent;
      font-size: 16px;
      margin-bottom: 15px;
      resize: none;
      outline: none;
      transition: 0.3s;
    }

    textarea:focus { border-color: var(--primary); }

    .btn-post {
      background: var(--primary);
      color: black;
      border: none;
      padding: 12px 40px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-post:hover { background: white; transform: scale(1.05); }

    #feedContainer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .post {
      background: white;
      color: #1a1a1a;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      text-align: left;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .post small {
      color: #888;
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
    }

    .post p { margin: 0; line-height: 1.6; font-size: 1.1rem; }

    .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      padding: 5px 8px;
      font-size: 0.7rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <button class="nav-btn active" onclick="showPage('home', this)">Feed</button>
    <button class="nav-btn" onclick="showPage('profile', this)">Profile</button>
    <button class="nav-btn" onclick="showPage('search', this)">Search</button>
  </nav>

  <main>
    <section id="home" class="page active">
      <h1>MyRock Feed</h1>
      
      <div class="post-box">
        <textarea id="postInput" placeholder="What's rocking today? (Ctrl+Enter to post)"></textarea>
        <button class="btn-post" onclick="addPost()">POST</button>
      </div>

      <div id="feedContainer"></div>
    </section>

    <section id="profile" class="page">
      <h1>Your Profile</h1>
      <div class="post-box">
        <div style="font-size: 5rem;">🎸</div>
        <p><strong>Username:</strong> RockStar_01</p>
        <p><strong>Bio:</strong> Code and Guitar lover.</p>
      </div>
    </section>

    <section id="search" class="page">
      <h1>Search</h1>
      <input type="text" placeholder="Search for rock legends..." 
             style="padding: 15px; border-radius: 30px; width: 80%; border: none; font-size: 1rem;">
    </section>
  </main>

  <canvas id="particleCanvas"></canvas>

  <script> 
    function showPage(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');
    }

    const feedContainer = document.getElementById('feedContainer');
    const postInput = document.getElementById('postInput');

    window.onload = () => {
      const savedPosts = JSON.parse(localStorage.getItem('myRockPosts')) || [];
      savedPosts.forEach((post, index) => renderPost(post.text, post.date, index));
    };

    postInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') addPost();
    });

    function addPost() {
      const text = postInput.value.trim();
      if (!text) return;

      const date = new Date().toLocaleString('en-US');
      const savedPosts = JSON.parse(localStorage.getItem('myRockPosts')) || [];
      
      const newPost = { text, date };
      savedPosts.unshift(newPost);
      localStorage.setItem('myRockPosts', JSON.stringify(savedPosts));

      refreshFeed();
      postInput.value = "";
    }

    function deletePost(index) {
      let savedPosts = JSON.parse(localStorage.getItem('myRockPosts')) || [];
      savedPosts.splice(index, 1);
      localStorage.setItem('myRockPosts', JSON.stringify(savedPosts));
      refreshFeed();
    }

    function refreshFeed() {
      feedContainer.innerHTML = '';
      const savedPosts = JSON.parse(localStorage.getItem('myRockPosts')) || [];
      savedPosts.forEach((post, index) => renderPost(post.text, post.date, index));
    }

    function renderPost(text, date, index) {
      const postDiv = document.createElement('div');
      postDiv.className = 'post';
      
      const meta = document.createElement('small');
      meta.textContent = `🕒 ${date}`;
      
      const content = document.createElement('p');
      content.textContent = text;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'Remove';
      delBtn.onclick = () => deletePost(index);

      postDiv.append(meta, content, delBtn);
      feedContainer.appendChild(postDiv);
    }

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    const emojis = ["⚡", "🎸", "🤘", "🔥"];

    function setCanvasSize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.init();
      }
      init() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 20 + 10;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
        this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      draw() {
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px serif`;
        ctx.fillText(this.emoji, this.x, this.y);
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width || this.x < 0 || this.y > canvas.height || this.y < 0) {
          this.init();
        }
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < 30; i++) particlesArray.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      setCanvasSize();
      initParticles();
    });

    setCanvasSize();
    initParticles();
    animate();
  </script>
</body>
</html>
